name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. The constraints these tests check exist
    # precisely so that application code cannot route around them, and asserting
    # them in TypeScript would test the wrong layer.
    #
    # Without this service the database suites would SKIP rather than fail —
    # they are written that way so a contributor without Docker still gets a
    # signal. In CI a silent skip is the worst possible outcome, so the service
    # is provided and the run asserts they actually executed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:55432/rift_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create the test database
        run: |
          until pg_isready -h localhost -p 55432 -U postgres; do sleep 1; done
          PGPASSWORD=pw psql -h localhost -p 55432 -U postgres -c "create database rift_test;"

      # lib/db/query-shapes.test.ts runs every column list the data layer sends
      # against a real PostgREST, and skips without one. From 25 September CI
      # had none, so the skip check below failed every run: the right outcome,
      # but it meant the query shapes were checked on one laptop only. This is
      # the same schema, seed and grants scripts/local/up.sh builds, served by
      # the same PostgREST, in the `postgres` database the suites do not reset.
      - name: Schema and PostgREST for the query-shape suite
        env:
          PGPASSWORD: pw
        run: |
          P="psql -h localhost -p 55432 -U postgres -q -v ON_ERROR_STOP=1"
          $P < supabase/test/shim.sql
          for f in supabase/migrations/*_rift_*.sql; do $P < "$f"; done
          $P < supabase/seed/rift_programs.sql
          $P < supabase/test/postgrest-grants.sql
          docker run -d --name rift-postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:pw@localhost:55432/postgres" \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="rift-local-test-secret-at-least-32-chars-long" \
            -e PGRST_SERVER_PORT=3001 postgrest/postgrest
          for _ in $(seq 1 30); do curl -sf localhost:3001 >/dev/null && break; sleep 1; done
          curl -sf localhost:3001 >/dev/null || { docker logs rift-postgrest; exit 1; }

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Test
        run: npm test

      - name: Fail if the database suites skipped
        # A skip here means the constraints were never exercised, and the suite
        # would pass while proving nothing. That has happened once already.
        run: |
          npm test 2>&1 | tee /tmp/test.log
          if grep -qi "skipped" /tmp/test.log; then
            echo "::error::Database suites skipped in CI — the constraints were not exercised."
            exit 1
          fi

      # Built ONCE, with nothing configured, and then both measured and served.
      # The end-to-end suite runs against this exact bundle rather than one of
      # its own — otherwise the thing whose size is budgeted and the thing that
      # is walked are two different builds.
      - name: Build
        run: npx next build 2>&1 | tee /tmp/build.log
        env:
          # Sourcemap upload needs a token that a fork's PR will not have.
          # Building without it is the documented behaviour, not a workaround.
          SENTRY_AUTH_TOKEN: ""
          # Inlined at build time, and the reason /sitemap.xml once served
          # valid XML with no URLs in it for weeks.
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3177
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          NEXT_PUBLIC_SENTRY_DSN: ""

      # A budget, not a target. Every route in the public funnel pays this
      # before it pays for anything of its own, and the audience includes
      # people opening /abroad on a phone from another continent. It went from
      # 229 kB to 189 kB when Session Replay came out; the ceiling is set just
      # above that so the next thing to add forty kilobytes has to argue for it
      # here rather than arrive unnoticed.
      - name: First Load JS budget
        run: |
          KB=$(grep -oE "First Load JS shared by all +([0-9.]+) kB" /tmp/build.log \
               | grep -oE "[0-9.]+ kB$" | grep -oE "^[0-9.]+")
          if [ -z "$KB" ]; then
            echo "::error::Could not read First Load JS from the build output."
            exit 1
          fi
          echo "First Load JS shared by all: ${KB} kB (budget 200)"
          awk -v kb="$KB" 'BEGIN { exit (kb > 200) ? 1 : 0 }' || {
            echo "::error::Shared First Load JS is ${KB} kB, over the 200 kB budget."
            exit 1
          }

      # Walks the real path against the build above, with NO database.
      #
      # 649 unit tests did not catch one of this product's real defects. Every
      # one of them rendered perfectly and returned 200. This suite found four
      # more on its first run: a chip holding a sentence that took the seller
      # readout sideways on a phone, the same on the buyer readout's primary
      # call to action, a header that did not fit a 320px screen, and a blank
      # white page on the seller funnel's front door until JavaScript arrived.
      #
      # Running it unconfigured also makes it the first real test of the
      # degradation contract — every public page must render without a
      # database, which until now had only been asserted against mocks.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
