<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    The tab icon. Rift's own mark, not a letter set in a typeface: at 16px a
    rendered glyph depends on a font the browser may not have, and this has to
    be the same shape as the header on every page.

    Dark square, light mark. The inverse disappears against a light tab strip,
    and this is the only place the product is seen at 16 pixels.
  -->
  <rect width="32" height="32" rx="7" fill="#0d0e10"/>
  <g transform="translate(3.6 4)">
    <path d="M4 21V3h7.4c3.5 0 5.9 2 5.9 5.2 0 2.5-1.5 4.3-3.9 4.9L21 21h-4.3l-4.9-7.3h-3.4V21H4Z" fill="#ffffff"/>
    <path d="M8.4 6.5v4.1h2.8c1.4 0 2.3-.8 2.3-2.05S12.6 6.5 11.2 6.5H8.4Z" fill="#0d0e10"/>
  </g>
</svg>
